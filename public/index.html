<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאתר מיקום</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      font-size: 1.4rem;
      color: #a78bfa;
      margin-bottom: 28px;
      letter-spacing: 0.05em;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b9a;
      margin-bottom: 12px;
    }

    .value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
    }

    .unit {
      font-size: 1rem;
      color: #6b6b9a;
      margin-right: 6px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-left: 8px;
      vertical-align: middle;
    }
    .status-dot.connected { background: #22c55e; }

    #status-text {
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .compass {
      width: 120px;
      height: 120px;
      margin: 12px auto 0;
      position: relative;
    }

    .compass svg {
      width: 100%;
      height: 100%;
    }

    #arrow {
      transform-origin: 60px 60px;
      transition: transform 0.5s ease;
    }

    #log {
      font-size: 0.72rem;
      color: #4b5563;
      margin-top: 20px;
      text-align: center;
      max-width: 340px;
    }
  </style>
</head>
<body>

  <h1>📡 מאתר מיקום בזמן אמת</h1>

  <!-- Status -->
  <div class="card">
    <h2>סטטוס חיבור</h2>
    <span id="status-text">מתחבר...</span>
    <span class="status-dot" id="dot"></span>
  </div>

  <!-- My location -->
  <div class="card">
    <h2>המיקום שלי</h2>
    <div id="my-location" class="value" style="font-size:1rem; color:#9ca3af;">ממתין ל-GPS...</div>
  </div>

  <!-- Distance -->
  <div class="card">
    <h2>מרחק מהטלפון השני</h2>
    <div>
      <span class="value" id="distance">--</span>
      <span class="unit">מטרים</span>
    </div>
  </div>

  <!-- Angle -->
  <div class="card">
    <h2>זווית ביחס לצפון</h2>
    <div>
      <span class="value" id="angle">--</span>
      <span class="unit">°</span>
    </div>
    <div class="compass">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Compass ring -->
        <circle cx="60" cy="60" r="55" fill="none" stroke="#2d2d4e" stroke-width="2"/>
        <text x="60" y="14" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">N</text>
        <text x="60" y="112" text-anchor="middle" fill="#6b6b9a" font-size="10">S</text>
        <text x="108" y="64" text-anchor="middle" fill="#6b6b9a" font-size="10">E</text>
        <text x="12" y="64" text-anchor="middle" fill="#6b6b9a" font-size="10">W</text>
        <!-- Arrow -->
        <g id="arrow">
          <polygon points="60,15 65,60 60,55 55,60" fill="#a78bfa"/>
          <polygon points="60,105 65,60 60,65 55,60" fill="#4b5563"/>
        </g>
      </svg>
    </div>
  </div>

  <div id="log">ממתין לנתונים...</div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    // ─── Connect to server ───────────────────────────────────────────
    // In production this auto-detects the server URL
    const socket = io();

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const distanceEl = document.getElementById("distance");
    const angleEl = document.getElementById("angle");
    const arrowEl = document.getElementById("arrow");
    const myLocationEl = document.getElementById("my-location");
    const logEl = document.getElementById("log");

    let myLat = null, myLng = null;

    socket.on("connect", () => {
      dot.classList.add("connected");
      statusText.textContent = "מחובר לשרת ✓";
    });

    socket.on("disconnect", () => {
      dot.classList.remove("connected");
      statusText.textContent = "מנותק";
    });

    // ─── GPS ─────────────────────────────────────────────────────────
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          myLat = pos.coords.latitude;
          myLng = pos.coords.longitude;
          myLocationEl.textContent = `${myLat.toFixed(5)}, ${myLng.toFixed(5)}`;
          socket.emit("send-location", { lat: myLat, lng: myLng });
        },
        (err) => {
          myLocationEl.textContent = "שגיאה: " + err.message;
          logEl.textContent = "לא הצלחנו לקבל GPS. בדקי הרשאות.";
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
      );
    } else {
      logEl.textContent = "הדפדפן לא תומך ב-GPS";
    }

    // ─── Receive other device location ───────────────────────────────
    socket.on("receive-location", (data) => {
      logEl.textContent = `קיבלנו מיקום מהטלפון השני: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;

      if (myLat === null || myLng === null) {
        distanceEl.textContent = "--";
        angleEl.textContent = "--";
        return;
      }

      const dist = haversineDistance(myLat, myLng, data.lat, data.lng);
      const bearing = calcBearing(myLat, myLng, data.lat, data.lng);

      distanceEl.textContent = dist < 1000
        ? Math.round(dist)
        : (dist / 1000).toFixed(2) + " ק״מ";

      if (dist < 1000) {
        document.querySelector('.unit').textContent = "מטרים";
      } else {
        document.querySelector('.unit').textContent = "";
      }

      angleEl.textContent = Math.round(bearing);
      arrowEl.style.transform = `rotate(${bearing}deg)`;
    });

    // ─── Math helpers ─────────────────────────────────────────────────
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function calcBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
  </script>
</body>
</html>
